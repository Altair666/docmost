# Боевой стек Docmost с нашими правками.
#
# Значения берутся из .env рядом с этим файлом; его создаёт установщик
# (deploy/install-linux.sh или deploy/windows/install.ps1) и заполняет
# случайными паролями. Руками там правится только адрес сайта и раздел
# Keycloak.
services:
  docmost:
    image: docmost-custom:${DOCMOST_IMAGE_TAG:-latest}
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      # Срок жизни сессии. По умолчанию Docmost ставит 90 дней — слишком
      # долго: столько работает вход у того, кого уже уволили. Сверка с
      # Keycloak гасит такого за сутки, но и сам срок сокращён.
      JWT_TOKEN_EXPIRES_IN: ${JWT_TOKEN_EXPIRES_IN:-30d}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Можно оставить пустыми: те же настройки задаются в интерфейсе на
      # странице «Keycloak SSO» и хранятся в базе.
      CUSTOM_OIDC_ISSUER: ${CUSTOM_OIDC_ISSUER:-}
      CUSTOM_OIDC_CLIENT_ID: ${CUSTOM_OIDC_CLIENT_ID:-}
      CUSTOM_OIDC_CLIENT_SECRET: ${CUSTOM_OIDC_CLIENT_SECRET:-}
      CUSTOM_OIDC_REDIRECT_URI: ${CUSTOM_OIDC_REDIRECT_URI:-}
    ports:
      # Наружу отдаёт обратный прокси, поэтому по умолчанию слушаем
      # только петлю. Нужен прямой доступ — поменяйте на "3000:3000".
      - "${DOCMOST_BIND:-127.0.0.1:3000}:3000"
    restart: unless-stopped
    volumes:
      - docmost_storage:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    # noeviction: очередь задач и совместное редактирование живут в
    # Redis, и молча выбрасывать оттуда ключи нельзя.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost_storage:
  db_data:
  redis_data:
