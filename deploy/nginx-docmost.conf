# Обратный прокси перед Docmost. То же, что делает IIS с ARR на нашем
# сервере с Windows, только короче.
#
#   cp deploy/nginx-docmost.conf /etc/nginx/sites-available/docmost
#   ln -s /etc/nginx/sites-available/docmost /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Сертификат ставится потом одной командой, она сама допишет сюда
# слушателя на 443 и переброс с 80:
#
#   certbot --nginx -d wiki.example.ru
#
# Docmost слушает петлю — наружу его отдаёт только этот файл.

# Заголовок Connection для веб-сокета: «upgrade», когда клиент просит
# подключение, и «close» во всех остальных случаях.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.example.ru;   # ← свой домен

    # Вложения в вики бывают крупными. Без этого nginx отвечает 413 на
    # файлах больше мегабайта, а в интерфейсе это выглядит просто как
    # «загрузка не удалась».
    client_max_body_size 500m;

    # Сжатие ложится на прокси: сам Docmost отдаёт файлы как есть.
    # Замер на работающем сервере — главный файл сборки 3.49 МБ, после
    # gzip 1.0 МБ. На медленном канале это разница между «открылось» и
    # «висит».
    gzip on;
    gzip_proxied any;          # ответы от proxy_pass по умолчанию не жмутся
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Совместное редактирование держит открытое соединение. Без
        # проброса Upgrade редактор молча уходит в режим чтения —
        # ошибки при этом никакой, и догадаться неоткуда.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Именно $remote_addr, а не $proxy_add_x_forwarded_for.
        #
        # Docmost сохраняет этот заголовок в колонку типа inet, и всё,
        # что не похоже на адрес, роняет вход с ошибкой Postgres. Второй
        # вариант дописывает наш адрес к тому, что прислал клиент, —
        # получается список через запятую, да ещё и с чужих слов. Мы
        # стоим на краю сети, врать здесь некому: пишем то, что видим.
        proxy_set_header X-Forwarded-For $remote_addr;

        # Открытое соединение редактора не должно рваться по тайм-ауту
        # в тихие минуты.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
