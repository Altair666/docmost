# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  GIT_SUBMODULE_FORCE_HTTPS: "true"


stages:          # List of stages for jobs, and their order of execution
  - update-version
  - build
  - deploy


update:version:
  # image: alpine:latest
  stage: update-version
  tags:
    - server-infra
  # artifacts:
  #   reports:
  #     dotenv: update.env
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_UPDATE_FLAGS: --remote
    GIT_SUBMODULE_FORCE_HTTPS: "true"
  # rules:
  #   - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    # - apk add --no-cache git jq curl
    - git config user.email "${GIT_USER_EMAIL:-$GITLAB_USER_EMAIL}"
    - git config user.name "${GIT_USER_NAME:-$GITLAB_USER_NAME}"
  script:
    #- git checkout $CI_COMMIT_BRANCH
    #- git submodule update --init --recursive

    # - export CURRENT_COMMIT=$(git ls-tree HEAD widget-decimalnumber | awk '{print $3}')
    - cd apps
    # - export LATEST_COMMIT=$(git ls-remote "$(git config --get remote.origin.url)" master | awk '{print $1}')
    # - echo "Current submodule ver is  ${CURRENT_COMMIT}"
    # - echo "Current actual ver is ${LATEST_COMMIT}"
    - cd ..


build-job:       # This job runs in the build stage, which runs first.
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_UPDATE_FLAGS: --remote
    GIT_SUBMODULE_FORCE_HTTPS: "true"
  stage: build
  tags:
    - server-infra
  only:
    - staging
    - prod
  before_script:
    - echo "Pre-script"
  script:
    - echo "Compiling the code..."
    - docker compose -f compose.yaml build docmost # --build-arg CUSTOM_BUILD=
    - echo "Compile complete."


deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  tags:
    - server-infra
  only:
    - staging
    - prod
  script:
    - echo "Deploying application..."

    # used ENVs --- defined in project's ci/cd settings
    # APP_SECRET \
    # POSTGRES_USER \
    # POSTGRES_PASSWORD \
    # POSTGRES_DB 
    - docker compose -f compose.yaml up -d db
    - docker compose -f compose.yaml up -d redis
    - docker compose -f compose.yaml up -d docmost

    - echo "Application successfully deployed."
